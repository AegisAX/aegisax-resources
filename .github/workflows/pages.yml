name: Refresh resources and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: aegisax-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Refresh official sources
        if: github.event_name != 'push'
        run: python3 scripts/update_catalog.py
      - name: Save the catalog snapshot
        if: github.event_name != 'push'
        run: |
          git add -- compliance-data.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh official resource catalog'
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html compliance.html styles.css compliance.css app.js compliance.js resources.json compliance-data.json favicon.svg .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
