<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이용 조건 확인 | AegisAX 자료실</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="compliance.css">
  <script src="compliance.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Aegis<span class="brand-accent">AX</span> 자료실</a></header>
  <main class="page-shell catalog">
    <nav class="portal-nav" aria-label="자료실 메뉴">
      <a href="compliance.html">법령·가이드</a>
      <a href="index.html">디자인 자료</a>

    <h1>이용 조건 확인</h1>
    <p>디자인 자료 라이선스와 공공저작물 정책의 공식 원문을 확인하세요.</p>
    <div class="catalog-controls">
      <label>이용 조건 검색 <input type="search" id="catalogQuery" placeholder="자료 또는 기관 이름"></label>
      <label>이용 조건 유형 <select id="catalogType"></select></label>
    </div>
    <p id="catalogStatus" role="status">이용 조건을 불러오는 중입니다.</p>
    <p id="catalogNotice"></p>
    <ul id="catalogList" class="catalog-list"></ul>
    <noscript>목록을 보려면 JavaScript를 켜주세요.</noscript>
  </main>

</html>
